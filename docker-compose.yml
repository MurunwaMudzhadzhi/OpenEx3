services:
  postgres:
    image: postgres:16-alpine
    container_name: openex-postgres
    environment:
      POSTGRES_DB: openex
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex
    ports:
      - "5432:5432"
    volumes:
      - openex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex -d openex"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openex-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: openex
      DB_USER: openex
      DB_PASSWORD: openex
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openex_pg_data:
