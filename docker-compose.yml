services:
  postgres:
    image: postgres:16-alpine
    container_name: openex-postgres
    environment:
      POSTGRES_DB: openex
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex
    ports:
      - "5432:5432"
    volumes:
      - openex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex -d openex"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openex-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: openex
      DB_USER: openex
      DB_PASSWORD: openex
      SERVER_PORT: 8080
      # Local-dev-only secret — real deployments must override this via a
      # proper secret manager / CI variable, never commit a production value.
      JWT_SECRET: local-dev-secret-a8f3c91e0b7d4f2896c1e5a7d3b8f0c2
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.5.4
    container_name: openex-ollama
    volumes:
      - openex_ollama_data:/root/.ollama
    healthcheck:
      # Checks the daemon itself is responding — deliberately NOT checking
      # that a model is pulled, since that's a separate manual step (see
      # ai-agent/README.md) and shouldn't block this container from
      # reporting healthy.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: openex-ai-agent
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      BACKEND_URL: http://backend:8080
    ports:
      - "8000:8000"
    healthcheck:
      # /ready (not /health) — returns a real failure status until Ollama
      # is reachable and the model is pulled, so Docker doesn't report this
      # container healthy prematurely. urlopen raises on the 503 /ready
      # returns while not ready, which is exactly what we want here: a
      # non-zero exit from this command until the service is actually
      # ready to serve requests.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  openex_pg_data:
  openex_ollama_data:
