spring:
  application:
    name: openex3-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:openex}
    username: ${DB_USER:openex}
    password: ${DB_PASSWORD:openex}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # never let Hibernate auto-manage schema — Flyway owns the schema
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.openex: DEBUG
    org.hibernate.SQL: WARN
